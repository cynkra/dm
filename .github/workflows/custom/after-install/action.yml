name: 'Custom steps to run after R packages are installed'

runs:
  using: "composite"
  steps:
    - uses: ankane/setup-postgres@v1
      if: env.DM_TEST_SRC == 'test-postgres'

    - name: Create database
      if: env.DM_TEST_SRC == 'test-postgres'
      run: |
        createdb ${USER}
      shell: bash

    # Must happen after installing system dependencies,
    # https://github.com/ankane/setup-mariadb/issues/2
    #
    # The version has to be one MariaDB publishes for the runner's Ubuntu.
    # `ubuntu-26.04` is Resolute, and the 10.11 line stops before it:
    # `apt-get update` then fails the whole step with
    # "The repository '.../mariadb-server/10.11/repo/ubuntu resolute Release'
    # does not have a Release file".
    # The action itself needs no help with a new codename -- it reads
    # `lsb_release -cs` -- and its own CI matrix marks the boundary:
    # `ubuntu-26.04` is tested with 12.3 and 11.8, 11.4 and 10.11 only up to
    # `ubuntu-24.04`. 12.3 is the current LTS, what the download page serves for
    # Resolute, and the action's own default.
    - uses: ankane/setup-mariadb@v1
      if: env.DM_TEST_SRC == 'test-maria'
      with:
        mariadb-version: "12.3"

    # Same story as MariaDB above, one release line further along: Oracle
    # publishes no `resolute` suite for the 8.0 line, so `mysql-apt-config`
    # leaves the action nothing to install. 8.4 is the current LTS and the
    # version the action itself defaults to on this image -- which also means
    # it is the one already on the runner, so the action starts the preinstalled
    # server instead of fetching a second one.
    - uses: ankane/setup-mysql@v1
      if: env.DM_TEST_SRC == 'test-mysql-maria'
      with:
        mysql-version: "8.4"

    - name: Create database (MariaDB), set it to UTF-8, add time zone info
      if: env.DM_TEST_SRC == 'test-maria' || env.DM_TEST_SRC == 'test-mysql-maria'
      # MariaDB renamed its client binaries to `mariadb*` in 11.0 and keeps the
      # `mysql*` names as deprecated symlinks, so prefer the name the server
      # actually ships. The MySQL entry of the matrix has no `mariadb` binary
      # and lands on the fallback, which is the name it wants anyway.
      run: |
        client="$(command -v mariadb || command -v mysql)"
        "${client}" -e "CREATE DATABASE IF NOT EXISTS test; ALTER DATABASE test CHARACTER SET 'utf8'; FLUSH PRIVILEGES;"
      shell: bash

    - uses: ankane/setup-sqlserver@v1
      if: env.DM_TEST_SRC == 'test-mssql'
      with:
        accept-eula: true

    - name: Create database (SQL Server)
      if: env.DM_TEST_SRC == 'test-mssql'
      run: |
        sqlcmd -U SA -P 'YourStrong!Passw0rd' -Q 'CREATE DATABASE test;'
      shell: bash

    - name: Set ODBCSYSINI (SQL Server)
      if: env.DM_TEST_SRC == 'test-mssql'
      # The driver generation follows the server: on the only image Microsoft
      # still serves a repository for, the action installs SQL Server 2025 and
      # with it `mssql-tools18`, which carries `msodbcsql18`. The package ships
      # the library under its full version, so link the plain name that
      # `.github/odbc/odbcinst.ini` points at; `-f` because a future package may
      # ship that link itself, and a second run must not fail on it.
      run: |
        ln -sf /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.*.so.* /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.so
        echo "ODBCSYSINI=${{ github.workspace }}/.github/odbc" | tee -a $GITHUB_ENV
      shell: bash

    - name: Allow slower examples
      run: |
        # FIXME: Slow examples in dm?
        echo "_R_CHECK_EXAMPLE_TIMING_THRESHOLD_=15" | tee -a $GITHUB_ENV
      shell: bash

    # Instrumented-validation matrix entry (DM_VALIDATE=true): uncomment the
    # code guarded by "# INSTRUMENT: validate" so the assertions are compiled
    # in. The matrix entry runs with covr: true, so the standard covr step then
    # builds and tests these instrumented sources.
    - name: Instrument R code for validation
      if: env.DM_VALIDATE != ''
      run: |
        if [ $(git status --porcelain | wc -l) -gt 0 ]; then
          echo "Fatal: git working copy not clean"
        fi
        sed -i -r '/INSTRUMENT: validate/ s/^( +)# /\1/g' R/*
        if [ $(git status --porcelain | wc -l) -eq 0 ]; then
          echo "Fatal: substitution did not change anything"
        fi
      shell: bash
