name: 'Custom steps to run before R packages are installed'

inputs:
  env:
    description: >
      Additional environment variables (one KEY=VALUE per line) contributed by
      the test matrix. Generic hook used by .github/versions-matrix.R to flag
      special matrix entries (e.g. the instrumented-validation entry below).
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Apply environment variables from the test matrix
      if: inputs.env != ''
      env:
        MATRIX_ENV: ${{ inputs.env }}
      run: |
        printf '%s\n' "$MATRIX_ENV" | tee -a "$GITHUB_ENV"
      shell: bash

    # The instrumented-validation matrix entry sets DM_VALIDATE=true via the
    # generic "env" field. Opt it out of the snapshot updater, which bypasses
    # tests/testthat.R via testthat::test_local() and would otherwise run the
    # instrumented tests twice.
    - name: Opt out of the snapshot updater (instrumented validation)
      if: env.DM_VALIDATE != ''
      run: |
        echo 'SKIP_UPDATE_SNAPSHOTS=true' | tee -a "$GITHUB_ENV"
      shell: bash

    - name: Define _R_CHECK_PKG_SIZES_THRESHOLD_
      run: |
        echo '_R_CHECK_PKG_SIZES_THRESHOLD_=10' | tee -a $GITHUB_ENV
      shell: bash

    - name: Define DM_TEST_SRC
      run: |
        echo "DM_TEST_SRC=${{ matrix.config.test-src }}" | tee -a $GITHUB_ENV
      shell: bash

    - name: Clean up broken mysql apt
      # FIXME: Remove if package becomes unavailable
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        if [ $(lsb_release --short --codename) == 'focal' ]; then
          sudo apt-get install mysql-common=5.8+1.0.5ubuntu2 --allow-downgrades
        fi
      shell: bash

    - name: Allow installing odbc from source on macOS
      if: runner.os == 'macOS'
      run: |
        brew install unixodbc
      shell: bash

    # The duckdb test source connects with a bare `duckdb::duckdb()`,
    # which leaves it to the package to pick where downloaded extensions
    # and stored secrets live.
    # Whenever the package picks by itself it announces the location:
    # a missing `~/.duckdb` draws the long "temporary directory" notice,
    # and a bare `~/.duckdb` still draws a shorter "storing under ~/.duckdb" one
    # (see `?duckdb_storage`).
    # Both are noise in CI, and both can leak into test output.
    #
    # So create the shared home -- the same directory the duckdb repo creates in
    # its own CI -- and additionally point `DUCKDB_R_HOME` at it.
    # The environment variable counts as an explicit choice,
    # so duckdb resolves to that directory without announcing anything,
    # while the directory itself keeps extensions in one place for the whole run.
    # duckdb derives the home from `USERPROFILE` on Windows and `HOME` elsewhere,
    # so match that here rather than relying on shell `~` expansion.
    - name: Create the shared DuckDB home (~/.duckdb)
      run: |
        if [ "${RUNNER_OS}" = "Windows" ]; then
          home="$(cygpath -u "${USERPROFILE}")"
        else
          home="${HOME}"
        fi
        mkdir -p "${home}/.duckdb"
        duckdb_home="${home}/.duckdb"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          duckdb_home="$(cygpath -w "${duckdb_home}")"
        fi
        echo "DUCKDB_R_HOME=${duckdb_home}" | tee -a "$GITHUB_ENV"
      shell: bash
