name: "Action to determine extra packages to be installed"
outputs:
  packages:
    description: "List of extra packages"
    value: ${{ steps.get-extra.outputs.packages }}

runs:
  using: "composite"
  steps:
    - name: Get extra packages
      # DCF values wrap onto indented continuation lines, which a plain
      # `grep | cut` cannot see past the first line of; read.dcf() is
      # DCF-aware and folds continuation lines back into the value.
      id: get-extra
      run: |
        x <- read.dcf("DESCRIPTION", fields = "Config/gha/extra-packages")[1, 1]
        packages <- if (is.na(x)) "" else gsub("[[:space:]]+", " ", trimws(x))
        cat("packages=", packages, "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
      shell: Rscript {0}
